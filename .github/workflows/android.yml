name: Build NeonPulse APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true
    - name: Build Debug APK
      run: ./gradlew assembleDebug || echo "Gradle wrapper missing, add standard wrapper if needed"

